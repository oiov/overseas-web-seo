<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="出海 SEO + GEO：新词站拼速度，养老站拼时间">
  <defs>
    <style>
      .ink { fill: #1B2320; }
      .muted { fill: #1B2320; opacity: .6; }
      .title { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 62px; letter-spacing: -1.5px; }
      .sub { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; font-size: 21px; }
      .label { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; }
      .cmd { font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 15px; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D6DCD2" stroke-width="1"/>
    </pattern>
    <pattern id="gridbold" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#C6CFC3" stroke-width="1.25"/>
    </pattern>
    <linearGradient id="spikeArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2452F" stop-opacity=".16"/>
      <stop offset="1" stop-color="#C2452F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="#F1F2EC"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#gridbold)"/>

  <text class="title ink" x="64" y="152">出海 SEO + GEO</text>
  <text class="sub muted" x="66" y="198">从找一个词开始，到上站、养站，再到 AI 搜索推荐你</text>

  <!-- 新词站：陡起陡落 -->
  <path d="M696 336 L772 328 C800 324 806 136 826 136 C846 136 856 310 892 320 L962 324 L962 336 Z"
        fill="url(#spikeArea)"/>
  <path d="M696 336 L772 328 C800 324 806 136 826 136 C846 136 856 310 892 320 L962 324"
        fill="none" stroke="#C2452F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="826" cy="136" r="7" fill="#C2452F"/>
  <rect x="776" y="88" width="10" height="10" rx="2" fill="#C2452F"/>
  <text class="label" x="794" y="99" fill="#C2452F">新词站，拼速度</text>

  <!-- 养老站：慢起，后来居上 -->
  <path d="M696 336 C790 334 830 330 900 312 C1010 284 1090 220 1216 138"
        fill="none" stroke="#1E6B57" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1216" cy="138" r="7" fill="#1E6B57"/>
  <rect x="1054" y="88" width="10" height="10" rx="2" fill="#1E6B57"/>
  <text class="label" x="1072" y="99" fill="#1E6B57">养老站，拼时间</text>

  <text class="cmd muted" x="64" y="396">$ npx skills add oiov/overseas-web-seo</text>
  <text class="cmd muted" x="1216" y="396" text-anchor="end" style="font-size:13px">给 Claude Code、Codex 等 AI Agent 使用，MIT 许可</text>
</svg>
